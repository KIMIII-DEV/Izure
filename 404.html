<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Seite nicht gefunden — Maurice Risch</title>
<meta name="description" content="Diese Adresse führt ins Leere. Zurück zur Startseite von Maurice Risch.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E4B9A'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-weight='700' font-size='30' fill='%23FFFDFC' text-anchor='middle'%3EMR%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bone:#F4F3F0;--paper:#FFFDFC;--ink:#1B2A4A;--blue:#1E4B9A;--gray:#6B6B75;--line:rgba(27,42,74,.11);--eo:cubic-bezier(.23,1,.32,1)}
html{-webkit-text-size-adjust:100%}
body{min-height:100svh;display:grid;place-items:center;padding:clamp(24px,5vw,64px);background:var(--bone);color:var(--ink);font:400 clamp(15px,1vw,17px)/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;background-image:radial-gradient(circle at 1px 1px,rgba(27,42,74,.1) 1px,transparent 0);background-size:24px 24px;mask-image:linear-gradient(180deg,transparent,#000 30%,#000 60%,transparent)}
main{position:relative;width:min(100%,560px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(16px,2.2vw,24px)}
.code{font:500 11px/1 inherit;letter-spacing:.18em;color:var(--gray)}
h1{font:700 clamp(30px,5vw,52px)/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.03em;text-wrap:pretty}
p{color:var(--gray);max-width:32em;text-wrap:pretty}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
a{display:inline-flex;align-items:center;gap:9px;padding:13px 26px;border-radius:100px;text-decoration:none;font:500 1em/1 inherit;transition:transform .16s ease-out,background .26s ease,box-shadow .26s ease}
a:active{transform:scale(.97)}
.pri{background:var(--ink);color:var(--paper)}
.pri:hover{background:var(--blue)}
.sec{color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.sec:hover{box-shadow:inset 0 0 0 1px var(--blue);color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.12s!important}}
</style>
</head>
<body>
<main>
<span class="code">FEHLER 404</span>
<h1>Diese Adresse führt ins Leere.</h1>
<p>Die Seite wurde verschoben, umbenannt oder hat nie existiert. Der Weg zurück ist kurz.</p>
<div class="row">
<a class="pri" href="/">Zur Startseite</a>
<a class="sec" href="/#contact">Kontakt</a>
</div>
</main>
</body>
</html>
